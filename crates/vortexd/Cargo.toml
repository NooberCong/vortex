[package]
name = "vortexd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The Vortex daemon — owns every job, every byte, and every setting."

[[bin]]
name = "vortexd"
path = "src/main.rs"

[dependencies]
vortex-proto = { workspace = true }
vortex-engine = { workspace = true }
vortex-media = { workspace = true }
vortex-ipc = { workspace = true }
vortex-setup = { workspace = true }

anyhow = { workspace = true }
clap = { workspace = true }
dirs = "6"
parking_lot = { workspace = true }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"

[dev-dependencies]
hostile-server = { path = "../../bench/hostile-server" }
tempfile = "3"
