[package]
name = "vortex-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Vortex media pipeline — HLS/DASH parsing, segment assembly, AES-128, ffmpeg muxing."

[dependencies]
vortex-proto = { workspace = true }
vortex-engine = { workspace = true }

anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["process"] }
tracing = { workspace = true }
url = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
hex = { workspace = true }

quick-xml = "0.41"
aes = "0.9"
cbc = { version = "0.2", features = ["block-padding"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tempfile = "3"
hostile-server = { path = "../../bench/hostile-server" }
