<!doctype html>
<html data-theme="light">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="../../../packages/tokens/tokens.css" />
    <link rel="stylesheet" href="screens.css" />
  </head>
  <body>
    <div class="stage">
      <div>
        <div class="eyebrow">Per-site control</div>
        <h1 class="headline">Off wherever<br />you say so</h1>
        <p class="sub">
          One switch per site, in the popup. Turned off, Vortex leaves that site's
          downloads to the browser and stops watching it. Turn it back on whenever you
          like — the same switch does both.
        </p>
        <p class="foot">Subscription services that use DRM are excluded outright.</p>
      </div>
      <div class="panel"><iframe src="popup.html?off" scrolling="no"></iframe></div>
    </div>
  </body>
</html>
