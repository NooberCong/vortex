  <body>
    <div class="stage">
      <div>
        <div class="eyebrow">Browser extension</div>
        <h1 class="headline">Every download,<br />handed to Vortex</h1>
        <p class="sub">
          Vortex takes the transfer the moment your browser starts one, and fetches it in
          parallel instead. If the app is not running, nothing is taken over and your
          browser downloads exactly as it always did.
        </p>
        <p class="foot">Requires the free Vortex desktop app.</p>
      </div>
      <div class="panel"><iframe src="popup.html" scrolling="no"></iframe></div>
    </div>
  </body>
