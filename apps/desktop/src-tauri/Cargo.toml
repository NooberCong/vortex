[package]
name = "vortex-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The Vortex window — a pure view over vortexd."

[lib]
# A library so the setup is testable and the binary stays a four-line shim over it.
#
# Tauri's template also asks for `staticlib` and `cdylib`, which exist for the mobile
# targets. Mobile is out of scope for 1.0 (06 §Explicitly out of scope), and a `cdylib` of
# this size does not link at all under the GNU toolchain — the whole of Tauri, wry and tao
# exceeds what a Windows export table can address. An `rlib` has no export table.
name = "vortex_app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
vortex-proto = { workspace = true }
vortex-ipc = { workspace = true }

tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
# Already compiled in underneath `tauri-plugin-notification`; asked for by name because
# the plugin drops the handle a click arrives on. See `src/toast.rs`.
notify-rust = "4.18"

[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.6"
# Only for `DWMWA_WINDOW_CORNER_PREFERENCE` — see `chrome::square_corners`. Tauri already
# builds this crate; this asks for one more feature of it, not one more dependency.
windows = { version = "0.61", features = ["Win32_Graphics_Dwm"] }
